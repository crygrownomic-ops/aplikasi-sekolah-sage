<!-- Form Identitas -->
<form onsubmit="saveSchoolProfile(event)">
  <div class="form-grid">
    <div class="form-group full-width">
      <label>Nama Resmi Sekolah</label>
      <input type="text" id="inputNamaSekolah" placeholder="Contoh: SMA Negeri 1 Jakarta" required>
    </div>

    <div class="form-group">
      <label>Email Kontak Sekolah</label>
      <input type="email" id="inputEmailSekolah" placeholder="admin@sekolah.sch.id">
    </div>

    <div class="form-group">
      <label>Nomor Telepon / WhatsApp Sekolah</label>
      <input type="text" id="inputTelpSekolah" placeholder="(021) xxxxxxx">
    </div>

    <div class="form-group full-width">
      <label>Upload Logo Sekolah (.PNG / .JPG)</label>
      <input type="file" id="inputLogoSekolah" accept="image/*" onchange="handleLogoUpload(event)">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Simpan Profil Sekolah</button>
  </div>
</form>
